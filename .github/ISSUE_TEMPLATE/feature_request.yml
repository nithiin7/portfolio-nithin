name: Feature or content request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Design / motion,
          Content,
          Blog,
          Case studies,
          Command palette / AI,
          Performance,
          Accessibility,
          Tooling,
        ]
