name: CI

on:
  pull_request:
    branches: [main, dev, redesign]
  push:
    branches: [main, dev, redesign]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, typecheck, knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm knip
      - name: Embeddings match data/knowledge
        run: pnpm embed:check

  test:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const { total } = JSON.parse(fs.readFileSync(file, "utf8"));
            const rows = ["statements", "branches", "functions", "lines"]
              .map((k) => `| ${k} | ${total[k].pct}% | ${total[k].covered}/${total[k].total} |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              ["### Coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |", ...rows, ""].join("\n"));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    # Forks don't receive secrets; their build runs on Vercel's preview instead
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ secrets.CONTENTFUL_ENVIRONMENT }}
      CONTENTFUL_VERSION: ${{ secrets.CONTENTFUL_VERSION }}
      CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check for Contentful credentials
        id: secrets
        run: echo "available=${{ env.CONTENTFUL_SPACE_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.available == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.available == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.available == 'true'
      - run: pnpm build
        if: steps.secrets.outputs.available == 'true'
      - name: Skipped
        if: steps.secrets.outputs.available != 'true'
        run: echo "::notice::Contentful secrets are not configured; build skipped."
