name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm eslint

      - name: Format check
        run: pnpm prettier

      - name: Typecheck
        run: pnpm exec tsc --noEmit

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_ENVIRONMENT }}
      NEXT_PUBLIC_SPACE_ID: ${{ secrets.NEXT_PUBLIC_SPACE_ID }}
      NEXT_PUBLIC_VERSION: ${{ secrets.NEXT_PUBLIC_VERSION }}
      NEXT_PUBLIC_AUTHORIZATION_TOKEN: ${{ secrets.NEXT_PUBLIC_AUTHORIZATION_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Job-level `if` cannot read secrets, so gate each step instead —
      # skips e2e cleanly on repos/forks without Contentful credentials
      - name: Check secrets
        id: secrets
        run: echo "available=${{ env.NEXT_PUBLIC_SPACE_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.secrets.outputs.available == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.secrets.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.secrets.outputs.available == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        if: steps.secrets.outputs.available == 'true'
        run: pnpm build

      - name: Run e2e tests
        if: steps.secrets.outputs.available == 'true'
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure() && steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
